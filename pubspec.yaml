name: tiktok_downloader
description: "A simple TikTok downloader app without watermark."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  path_provider: ^2.1.5
  image_gallery_saver_plus: ^5.0.0
  permission_handler: ^12.0.0
  device_info_plus: ^13.1.0
  ffmpeg_kit_flutter_new: ^4.2.0
  video_player: ^2.11.1
  share_plus: ^13.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_logo.png"
  adaptive_icon_background: "#0F0F13"
  adaptive_icon_foreground: "assets/icon/app_logo.png"
